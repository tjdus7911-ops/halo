name: Emulator smoke test

# 일반 안드로이드 에뮬레이터(가로 1600×900)에서 APK 를 실제로 띄워 시연 장면을 끝까지 넘겨 본다.
# 앱이 꺼지지 않는지(FATAL EXCEPTION) 확인하고, 화면과 로그를 ci/emulator 브랜치에 올린다.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/**'
      - 'tools/emulator/**'
      - '.github/workflows/emulator.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run demo scenes on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator/smoke.sh

      - name: Publish to ci/emulator branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d emulator-out ] || exit 0
          cd emulator-out
          git init -q -b ci/emulator
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Emulator smoke test (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/emulator
